packages:
  - packages/*
  - samples/**

# pnpm 11 had no release-age gate; pnpm 12 defaults it to 24h. Pinned to 0 so this
# upgrade is behaviour-neutral — adopting the gate is a deliberate change, not a
# side effect of bumping packageManager. Tracked in #226.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@workleap/*'
  - '@typescript/native-preview*'

allowBuilds:
  agent-browser: true
  core-js: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  protobufjs: true
